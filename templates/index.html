<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频识别服务</title>
    
    <!-- 添加 markdown 支持库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
    
    <!-- 引入 markdown 样式 -->
    <link rel="stylesheet" href="/static/css/markdown.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: white;
            font-size: 2.5em;
            font-weight: 300;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .container {
            display: flex;
            height: calc(100vh - 120px);
            margin: 20px;
            gap: 20px;
        }

        .video-section {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .results-section {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
            font-weight: 600;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .camera-card {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            min-height: 180px;
            display: flex;
            flex-direction: column;
        }

        .camera-stats-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            min-width: 132px;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }

        .camera-stats-line {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.78em;
            line-height: 1.2;
        }

        .camera-stats-label {
            color: rgba(255, 255, 255, 0.7);
        }

        .camera-stats-value {
            color: #ffffff;
            font-weight: 700;
            text-align: right;
        }

        .camera-stats-value.online {
            color: #8ce99a;
        }

        .camera-stats-value.reconnecting {
            color: #ffd43b;
        }

        .camera-stats-value.offline {
            color: #ff8787;
        }

        .camera-title {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 12px;
            font-size: 0.95em;
            font-weight: 600;
        }

        .camera-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex: 1;
        }

        .camera-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.95em;
            background: rgba(0, 0, 0, 0.3);
        }

        .video-stream {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2em;
            z-index: 1;
        }

        .results-container {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .results-column {
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .results-column-title {
            font-size: 0.9em;
            font-weight: 600;
            color: #495057;
            padding-left: 4px;
        }

        .kb-panel {
            position: relative;
            background: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .kb-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .kb-btn {
            border: 0;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9em;
        }

        .kb-btn.primary { background: #2d8cf0; }
        .kb-btn.success { background: #19be6b; }
        .kb-btn.warning { background: #f59f00; }
        .kb-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .kb-pend-list {
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 8px;
            background: #fafafa;
        }

        .kb-pend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 0.9em;
        }

        .kb-pend-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .kb-preview-btn {
            border: 0;
            border-radius: 6px;
            padding: 4px 8px;
            color: #fff;
            background: #5c7cfa;
            cursor: pointer;
            font-size: 0.8em;
        }

        .kb-preview-btn:hover {
            background: #4c6ef5;
        }

        .kb-delete-btn {
            border: 0;
            border-radius: 6px;
            padding: 4px 8px;
            color: #fff;
            background: #fa5252;
            cursor: pointer;
            font-size: 0.8em;
        }

        .kb-delete-btn:hover {
            background: #f03e3e;
        }

        .kb-preview-btn.active {
            background: #e03131;
        }

        .kb-preview-btn.active:hover {
            background: #c92a2a;
        }

        .kb-pend-type {
            font-size: 0.8em;
            padding: 2px 6px;
            border-radius: 999px;
            color: #fff;
        }

        .kb-pend-type.alarm { background: #e03131; }
        .kb-pend-type.normal { background: #2f9e44; }
        .kb-pend-type.unknown { background: #495057; }

        .kb-status {
            margin-top: 8px;
            font-size: 0.88em;
            color: #495057;
            min-height: 20px;
        }

        .kb-preview-box {
            display: none;
            position: fixed;
            right: 24px;
            top: 110px;
            width: min(560px, calc(100vw - 48px));
            max-height: 36vh;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 1100;
            overflow: hidden;
            padding: 10px 10px 12px;
        }

        .kb-preview-box.active {
            display: block;
        }

        .kb-preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 8px;
        }

        .kb-preview-close {
            border: 0;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background: #fa5252;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            line-height: 26px;
            text-align: center;
            flex-shrink: 0;
        }

        .kb-preview-close:hover {
            background: #f03e3e;
        }

        .kb-preview-title {
            font-size: 0.85em;
            color: #495057;
            font-weight: 600;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .kb-preview-content {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.85em;
            line-height: 1.5;
            color: #212529;
            font-family: Consolas, 'Courier New', monospace;
            max-height: calc(36vh - 54px);
            overflow: auto;
        }

        .result-item {
            background: white;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
            animation: slideIn 0.5s ease-out;
        }

        .result-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .result-time {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .result-content {
            line-height: 1.6;
            color: #2c3e50;
            font-size: 0.95em;
        }

        .status {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 500;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .connected {
            background: #28a745;
            color: white;
        }

        .disconnected {
            background: #dc3545;
            color: white;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                margin: 10px;
                gap: 10px;
            }

            .header h1 {
                font-size: 2em;
            }

            .section-title {
                font-size: 1.2em;
            }

            .video-section, .results-section {
                padding: 15px;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .kb-preview-box {
                right: 12px;
                left: 12px;
                width: auto;
                top: 90px;
                max-height: 65vh;
            }
        }

        /* 滚动条样式 */
        .results-container::-webkit-scrollbar {
            width: 8px;
        }

        .results-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .results-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        .results-container::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>面向安防监控场景的多目标检测与分析</h1>
    </div>

    <div class="connection-status" id="connectionStatus">
        <span id="statusText">连接中...</span>
    </div>

    <div class="container">
        <div class="video-section">
            <h2 class="section-title">摄像头画面</h2>
            <div class="camera-grid" id="cameraGrid"></div>
        </div>

        <div class="results-section">
            <h2 class="section-title">分析结果</h2>
            <div class="kb-panel">
                <div class="kb-actions">
                    <button class="kb-btn primary" id="btnLoadPend">刷新待审核列表</button>
                    <button class="kb-btn success" id="btnImportPend">导入已选到知识库</button>
                    <button class="kb-btn warning" id="btnRebuildIndex">重建索引</button>
                </div>
                <div class="kb-pend-list" id="pendList">
                    <div class="status">待加载 pend 文件...</div>
                </div>
                <div class="kb-status" id="kbActionStatus"></div>
                <div class="kb-preview-box" id="kbPreviewBox">
                    <div class="kb-preview-header">
                        <div class="kb-preview-title" id="kbPreviewTitle">文件预览</div>
                        <button type="button" class="kb-preview-close" id="btnClosePreview" title="关闭预览">×</button>
                    </div>
                    <pre class="kb-preview-content" id="kbPreviewContent"></pre>
                </div>
            </div>
            <div class="results-grid">
                <div class="results-column">
                    <div class="results-column-title">cam1 日志</div>
                    <div class="results-container" id="resultsContainerCam1"></div>
                </div>
                <div class="results-column">
                    <div class="results-column-title">cam2 日志</div>
                    <div class="results-container" id="resultsContainerCam2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 markdown 工具 -->
    <script src="/static/js/markdown-utils.js"></script>
    
    <script>
        let ws;
        let reconnectInterval;
        const resultsContainer = document.getElementById('resultsContainer');
        const cameraGrid = document.getElementById('cameraGrid');
        const statusElement = document.getElementById('connectionStatus');
        const statusText = document.getElementById('statusText');
        const initialStatus = document.getElementById('initialStatus');
        const pendListEl = document.getElementById('pendList');
        const kbActionStatusEl = document.getElementById('kbActionStatus');
        const btnLoadPend = document.getElementById('btnLoadPend');
        const btnImportPend = document.getElementById('btnImportPend');
        const btnRebuildIndex = document.getElementById('btnRebuildIndex');
        const btnClosePreview = document.getElementById('btnClosePreview');
        const kbPreviewBoxEl = document.getElementById('kbPreviewBox');
        const kbPreviewTitleEl = document.getElementById('kbPreviewTitle');
        const kbPreviewContentEl = document.getElementById('kbPreviewContent');
        let currentPreviewFile = null;
        let cameraStatsCache = {};

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
             console.log(`尝试连接到: ${wsUrl}`);
            ws = new WebSocket(wsUrl);

            ws.onopen = function(event) {
                console.log('WebSocket连接已建立');
                updateConnectionStatus(true);
                clearInterval(reconnectInterval);
            };

            ws.onmessage = function(event) {
                console.log('📩 收到WebSocket消息:', event.data);
                try {
                    const result = JSON.parse(event.data);
                    console.log('✅ 解析成功:', result);

                    if (result.type === 'batch' && Array.isArray(result.data)) {
                        result.data.forEach((item) => addResult(item));
                    } else {
                        addResult(result);
                    }
                } catch (e) {
                    console.error('解析消息失败:', e);
                    console.log('原始数据:', event.data);
                }
            };

            ws.onclose = function(event) {
                console.log('WebSocket连接已关闭');
                updateConnectionStatus(false);
                
                // 尝试重连
                reconnectInterval = setInterval(() => {
                    console.log('尝试重新连接...');
                    connectWebSocket();
                }, 5000);
            };

            ws.onerror = function(error) {
                console.error('WebSocket错误:', error);
                updateConnectionStatus(false);
            };
        }

        function updateConnectionStatus(connected) {
            statusElement.className = `connection-status ${connected ? 'connected' : 'disconnected'}`;
            statusText.textContent = connected ? '✅ 已连接' : '❌ 连接断开';
        }

        function addResult(result) {
            // 隐藏初始状态提示
            if (initialStatus) {
                initialStatus.style.display = 'none';
            }
            console.log('开始渲染结果:', result);  
            const resultElement = document.createElement('div');
            resultElement.className = 'result-item';

            // 使用 markdown 渲染器处理内容
            const renderedContent = markdownRenderer.renderResultContent(result);

            const cameraLabel = result.camera_id ? `📷 ${result.camera_id} ` : '';
            resultElement.innerHTML = `
                <div class="result-time">${cameraLabel}🕒 ${result.timestamp || new Date().toLocaleTimeString()}</div>
                <div class="result-content">${renderedContent}</div>
            `;

            // 按摄像头分发到不同容器
            if (result.camera_id === 'cam1') {
                resultsContainerCam1.insertBefore(resultElement, resultsContainerCam1.firstChild);
            } else if (result.camera_id === 'cam2') {
                resultsContainerCam2.insertBefore(resultElement, resultsContainerCam2.firstChild);
            }

            // 初始化代码高亮
            if (typeof hljs !== 'undefined') {
                hljs.highlightAll();
            }

            // 自动滚动到顶部显示最新结果
            if (result.camera_id === 'cam1') {
                resultsContainerCam1.scrollTop = 0;
            } else if (result.camera_id === 'cam2') {
                resultsContainerCam2.scrollTop = 0;
            }
        }

        function renderCameras(cameras) {
            cameraGrid.innerHTML = '';

            cameras.forEach((camera) => {
                const card = document.createElement('div');
                card.className = 'camera-card';
                card.dataset.cameraId = camera.id;

                const title = document.createElement('div');
                title.className = 'camera-title';
                title.textContent = `${camera.name || camera.id}`;

                const statsOverlay = document.createElement('div');
                statsOverlay.className = 'camera-stats-overlay';
                statsOverlay.dataset.cameraId = camera.id;
                statsOverlay.innerHTML = `
                    <div class="camera-stats-line"><span class="camera-stats-label">FPS</span><span class="camera-stats-value">--</span></div>
                    <div class="camera-stats-line"><span class="camera-stats-label">画面延迟</span><span class="camera-stats-value">--</span></div>
                    <div class="camera-stats-line"><span class="camera-stats-label">状态</span><span class="camera-stats-value offline">离线</span></div>
                `;

                const loading = document.createElement('div');
                loading.className = 'camera-loading pulse';
                loading.textContent = '正在加载视频流...';

                const img = document.createElement('img');
                img.className = 'camera-stream';
                img.alt = `视频流-${camera.id}`;
                img.dataset.cameraId = camera.id;
                img.src = `/api/video/feed/${camera.id}`;

                img.onload = function() {
                    loading.style.display = 'none';
                };

                img.onerror = function() {
                    loading.textContent = '⚠️ 视频流加载失败';
                    loading.classList.remove('pulse');
                    loading.style.color = '#ff6b6b';
                    setTimeout(() => {
                        img.src = `/api/video/feed/${camera.id}?t=${new Date().getTime()}`;
                        loading.textContent = '🔄 重新加载视频流...';
                        loading.classList.add('pulse');
                        loading.style.color = '#fff';
                    }, 5000);
                };

                card.appendChild(title);
                card.appendChild(statsOverlay);
                card.appendChild(img);
                card.appendChild(loading);
                cameraGrid.appendChild(card);
            });

            applyCameraStats(cameraStatsCache);
        }

        function setKbStatus(text, isError = false) {
            kbActionStatusEl.textContent = text;
            kbActionStatusEl.style.color = isError ? '#c92a2a' : '#2b8a3e';
        }

        function formatSeconds(value) {
            const num = Number(value || 0);
            return `${num.toFixed(2)}s`;
        }

        function formatDelay(value) {
            const num = Number(value || 0);
            if (!Number.isFinite(num) || num <= 0) {
                return '--';
            }
            if (num < 1) {
                return `${Math.round(num * 1000)}ms`;
            }
            return `${num.toFixed(2)}s`;
        }

        function applyCameraStats(metrics) {
            const cameras = Array.isArray(metrics?.cameras) ? metrics.cameras : [];
            cameraStatsCache = {};
            cameras.forEach((camera) => {
                cameraStatsCache[camera.camera_id] = camera;
            });

            document.querySelectorAll('.camera-stats-overlay').forEach((overlay) => {
                const cameraId = overlay.dataset.cameraId;
                const stats = cameraStatsCache[cameraId];
                const fpsText = stats ? Number(stats.fps || 0).toFixed(2) : '--';
                const delayText = stats ? formatDelay(stats.frame_delay_seconds) : '--';
                const status = stats?.connection_status || 'offline';
                const statusMap = {
                    online: '在线',
                    reconnecting: '重连中',
                    offline: '离线'
                };
                const statusText = statusMap[status] || '离线';
                overlay.innerHTML = `
                    <div class="camera-stats-line"><span class="camera-stats-label">FPS</span><span class="camera-stats-value">${fpsText}</span></div>
                    <div class="camera-stats-line"><span class="camera-stats-label">画面延迟</span><span class="camera-stats-value">${delayText}</span></div>
                    <div class="camera-stats-line"><span class="camera-stats-label">状态</span><span class="camera-stats-value ${status}">${statusText}</span></div>
                `;
            });
        }

        async function loadCameraMetrics() {
            try {
                const resp = await fetch('/api/system/health');
                const data = await resp.json();
                if (!resp.ok || !data.status) {
                    throw new Error(data.detail || '获取健康数据失败');
                }
                applyCameraStats(data.metrics || {});
            } catch (e) {
                console.error('加载摄像头指标失败:', e);
            }
        }

        async function loadPendFiles() {
            try {
                setKbStatus('正在加载待审核文件...');
                const resp = await fetch('/api/kb/pend-files');
                const data = await resp.json();
                if (!resp.ok || data.status !== 'success') {
                    throw new Error(data.detail || '加载失败');
                }

                if (!Array.isArray(data.files) || data.files.length === 0) {
                    pendListEl.innerHTML = '<div class="status">暂无待审核文件</div>';
                    setKbStatus('待审核文件为空');
                    return;
                }

                pendListEl.innerHTML = data.files.map((f) => {
                    const type = f.type || 'unknown';
                    const safeName = escapeHtml(f.name);
                    const encodedName = encodeURIComponent(f.name);
                    return `
                    <label class="kb-pend-item">
                        <input type="checkbox" class="pend-check" value="${encodedName}">
                        <span class="kb-pend-type ${type}">${type}</span>
                        <span class="kb-pend-name" title="${safeName}">${safeName}</span>
                        <button type="button" class="kb-preview-btn" data-file="${encodedName}">预览</button>
                        <button type="button" class="kb-delete-btn" data-file="${encodedName}">删除</button>
                    </label>`;
                }).join('');

                setKbStatus(`已加载 ${data.count} 个待审核文件`);
            } catch (e) {
                pendListEl.innerHTML = '<div class="status">待审核列表加载失败</div>';
                setKbStatus(`加载失败: ${e.message}`, true);
            }
        }

        function getSelectedPendFiles() {
            const selected = [];
            document.querySelectorAll('.pend-check:checked').forEach((el) => {
                selected.push(decodeURIComponent(el.value));
            });
            return selected;
        }

        async function previewPendFile(fileName) {
            try {
                kbPreviewTitleEl.textContent = `文件预览: ${fileName}`;
                kbPreviewContentEl.textContent = '正在加载文件内容...';

                const resp = await fetch(`/api/kb/pend-preview?name=${encodeURIComponent(fileName)}`);
                const data = await resp.json();

                if (!resp.ok || data.status !== 'success') {
                    throw new Error(data.detail || '预览失败');
                }

                kbPreviewTitleEl.textContent = `文件预览: ${data.name}`;
                kbPreviewContentEl.textContent = data.content || '(空文件)';
                kbPreviewBoxEl.classList.add('active');
            } catch (e) {
                kbPreviewContentEl.textContent = `加载失败: ${e.message}`;
                kbPreviewBoxEl.classList.add('active');
                setKbStatus(`预览失败: ${e.message}`, true);
            }
        }

        function clearPreview() {
            currentPreviewFile = null;
            kbPreviewTitleEl.textContent = '文件预览';
            kbPreviewContentEl.textContent = '';
            kbPreviewBoxEl.classList.remove('active');
        }

        function resetPreviewButtons() {
            document.querySelectorAll('.kb-preview-btn').forEach((btn) => {
                btn.classList.remove('active');
                btn.textContent = '预览';
            });
        }

        async function togglePreview(fileName, buttonEl) {
            if (currentPreviewFile === fileName) {
                clearPreview();
                resetPreviewButtons();
                return;
            }

            currentPreviewFile = fileName;
            resetPreviewButtons();
            buttonEl.classList.add('active');
            buttonEl.textContent = '取消预览';
            await previewPendFile(fileName);
        }

        async function importSelectedPendFiles() {
            const files = getSelectedPendFiles();
            if (files.length === 0) {
                setKbStatus('请先勾选要导入的文件', true);
                return;
            }

            try {
                btnImportPend.disabled = true;
                setKbStatus(`正在导入 ${files.length} 个文件...`);

                const resp = await fetch('/api/kb/import-pend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files, move: true })
                });
                const data = await resp.json();

                if (!resp.ok || data.status !== 'success') {
                    throw new Error(data.detail || '导入失败');
                }

                setKbStatus(`导入完成: 成功 ${data.imported_count}，跳过 ${data.skipped.length}`);
                clearPreview();
                await loadPendFiles();
            } catch (e) {
                setKbStatus(`导入失败: ${e.message}`, true);
            } finally {
                btnImportPend.disabled = false;
            }
        }

        async function deletePendFile(fileName) {
            if (!window.confirm(`确认删除待审核文件？\n${fileName}`)) {
                return;
            }

            try {
                setKbStatus(`正在删除: ${fileName} ...`);
                const resp = await fetch('/api/kb/delete-pend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: [fileName] })
                });
                const data = await resp.json();

                if (!resp.ok || data.status !== 'success') {
                    throw new Error(data.detail || '删除失败');
                }

                if ((data.deleted || []).includes(fileName)) {
                    if (currentPreviewFile === fileName) {
                        clearPreview();
                        resetPreviewButtons();
                    }
                    setKbStatus(`删除成功: ${fileName}`);
                    await loadPendFiles();
                } else {
                    const reason = (data.skipped && data.skipped[0] && data.skipped[0].reason) || '未知原因';
                    throw new Error(reason);
                }
            } catch (e) {
                setKbStatus(`删除失败: ${e.message}`, true);
            }
        }

        async function rebuildKbIndex() {
            try {
                btnRebuildIndex.disabled = true;
                setKbStatus('正在重建索引，请稍候...');
                const resp = await fetch('/api/kb/update-index', { method: 'POST' });
                const data = await resp.json();

                if (!resp.ok || data.status !== 'success') {
                    throw new Error(data.detail || '索引重建失败');
                }

                setKbStatus('索引重建完成');
            } catch (e) {
                setKbStatus(`索引重建失败: ${e.message}`, true);
            } finally {
                btnRebuildIndex.disabled = false;
            }
        }

        async function loadCameras() {
            try {
                const response = await fetch('/api/system/cameras');
                const data = await response.json();
                const cameras = data.data || [];

                if (cameras.length === 0) {
                    cameraGrid.innerHTML = '<div class="status">暂无可用摄像头</div>';
                    return;
                }

                renderCameras(cameras);
            } catch (error) {
                console.error('获取摄像头列表失败:', error);
                cameraGrid.innerHTML = '<div class="status">摄像头加载失败</div>';
            }
        }

        // 页面加载完成后连接WebSocket和检查视频状态
        document.addEventListener('DOMContentLoaded', function() {
            connectWebSocket();
            loadCameras();
            loadPendFiles();
            loadCameraMetrics();

            btnLoadPend.addEventListener('click', loadPendFiles);
            btnImportPend.addEventListener('click', importSelectedPendFiles);
            btnRebuildIndex.addEventListener('click', rebuildKbIndex);
            btnClosePreview.addEventListener('click', () => {
                clearPreview();
                resetPreviewButtons();
            });

            setInterval(loadCameraMetrics, 10000);

            pendListEl.addEventListener('click', (event) => {
                const target = event.target;
                if (target && target.classList.contains('kb-preview-btn')) {
                    const fileName = decodeURIComponent(target.getAttribute('data-file') || '');
                    if (fileName) {
                        togglePreview(fileName, target);
                    }
                }
                if (target && target.classList.contains('kb-delete-btn')) {
                    const fileName = decodeURIComponent(target.getAttribute('data-file') || '');
                    if (fileName) {
                        deletePendFile(fileName);
                    }
                }
            });
            
            // 定期检查视频流状态
            setInterval(() => {
                const videoStreams = document.querySelectorAll('.camera-stream');
                videoStreams.forEach((stream) => {
                    if (!stream.complete) {
                        const cameraId = stream.dataset.cameraId;
                        stream.src = `/api/video/feed/${cameraId}?t=${new Date().getTime()}`;
                    }
                });
            }, 30000); // 每30秒检查一次
        });

        // 页面关闭时关闭WebSocket连接
        window.addEventListener('beforeunload', function() {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
